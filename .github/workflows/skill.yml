name: Skill

# Fast path-filtered gate for agent-skill packaging changes. The full
# Tests workflow still runs on the same pushes; this answers skill-only
# pull requests in seconds by running just the deterministic skill suites.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "docs/agent-skill.md"
      - "tests/test_agent_skill.py"
      - "tests/test_skill_evals.py"
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "docs/agent-skill.md"
      - "tests/test_agent_skill.py"
      - "tests/test_skill_evals.py"

permissions:
  contents: read

concurrency:
  group: skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync dev environment
        run: uv sync --frozen --extra dev
      - name: Agent skill packaging tests
        run: uv run pytest tests/test_agent_skill.py tests/test_skill_evals.py -q
