name: Publish photo classifier to Hugging Face

# Manual only. Not part of a library release. The Space demo
# (wiltodelta/remove-ai-watermarks) stays on distribute.yml / raiw-hf-space.
#
# Hub model: wiltodelta/raiw-photo-classify
# Secret: HF_TOKEN, write-role Hugging Face token (same secret Space sync uses).
#
# Weights are not in git. Full mode downloads the frozen Model 1 + receipt-gate
# files and the frozen multi-provider-source-v6.npz Model 2 bundle from GitHub
# Releases, exports the vision-only ONNX graph, then uploads everything with the
# card from docs/photo-classify-hf/.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish"
        required: true
      mode:
        description: "full = card plus weights from the release tags; card = README, operating-point, and fallback receipt gate only"
        type: choice
        options:
          - full
          - card
        default: full
      weights_tag:
        description: "GitHub Release tag holding clip-l-ft.pt, probe-weights-clip-l-ft.npz, detector.pt, and receipt-gate.npz"
        required: false
        default: photo-classify-freeze-2026-09-07
      source_weights_tag:
        description: "GitHub Release tag holding multi-provider-source-v6.npz"
        required: false
        default: source-classify-v6-freeze-2026-11-13

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Download freeze weights from GitHub Releases
        if: ${{ github.event.inputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.weights_tag || 'photo-classify-freeze-2026-09-07' }}
          SOURCE_TAG: ${{ github.event.inputs.source_weights_tag || 'source-classify-v6-freeze-2026-11-13' }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r artifact expected < <(
            jq -r '[.model2.artifact, .model2.artifact_sha256] | @tsv' docs/photo-classify-hf/operating-point.json
          )
          test -n "$artifact" && test "$artifact" != "null"
          test "${#expected}" -eq 64
          mkdir -p weights
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern clip-l-ft.pt \
            --pattern detector.pt \
            --pattern probe-weights-clip-l-ft.npz \
            --pattern receipt-gate.npz \
            --dir weights &
          pid_model1=$!
          gh release download "$SOURCE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$artifact" \
            --dir weights &
          pid_model2=$!
          wait "$pid_model1" "$pid_model2"
          echo "$expected  weights/$artifact" | sha256sum --check
          ls -l weights

      - name: Export the vision-only ONNX graph
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          uv run --extra classify --with onnx python scripts/export_photo_classify_onnx.py \
            --checkpoint weights/clip-l-ft.pt \
            --out weights/clip-l-ft-vision-fp32.onnx

      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODE: ${{ github.event.inputs.mode }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is not set" >&2
            exit 1
          fi
          extra=(--message "Photo-classify freeze (GitHub ${SHA:0:7})")
          if [ "$MODE" = "card" ]; then
            extra+=(--card-only)
          else
            extra+=(--src weights)
          fi
          uv run --no-project --with huggingface-hub python scripts/publish_photo_classify_hf.py "${extra[@]}"
