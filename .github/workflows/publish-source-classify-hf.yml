name: Publish source classifier to Hugging Face

# Manual only. The derivative model weights live in a GitHub model-freeze
# release; the private training corpus and caches never enter this repository.
# Also synchronizes `wiltodelta/ai-image-detector-leaderboard` and audits
# external benchmark/arena surfaces so public leaderboards never lag a freeze.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish"
        required: true
      weights_tag:
        description: "GitHub Release tag holding the frozen source-classify weights"
        required: true
        default: source-classify-v8-freeze-2026-11-18
      recompute_leaderboard:
        description: "Re-evaluate the 578-image open benchmark on CPU before syncing the leaderboard Space"
        type: boolean
        required: false
        default: false

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Download derivative model weights
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.weights_tag }}
        run: |
          set -euo pipefail
          artifact="$(jq -r .artifact_file docs/source-classify-hf/metrics.json)"
          test -n "$artifact" && test "$artifact" != "null"
          mkdir -p weights
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$artifact" \
            --dir weights
          test -s "weights/$artifact"

      - name: Verify the frozen artifact
        run: |
          set -euo pipefail
          artifact="$(jq -r .artifact_file docs/source-classify-hf/metrics.json)"
          expected="$(jq -r .artifact_sha256 docs/source-classify-hf/metrics.json)"
          test -n "$artifact" && test "$artifact" != "null"
          test "${#expected}" -eq 64
          echo "$expected  weights/$artifact" | sha256sum --check

      - name: Publish model card and weights to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is not set" >&2
            exit 1
          fi
          uv run --no-project --with huggingface-hub \
            python scripts/publish_source_classify_hf.py \
            --src weights \
            --revision-out weights/published_revision.txt \
            --message "Source-classify freeze (GitHub ${SHA:0:7})"

      - name: Sync Open AI Image Detector Leaderboard and audit external arenas
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHA: ${{ github.sha }}
          RECOMPUTE: ${{ github.event.inputs.recompute_leaderboard }}
        run: |
          set -euo pipefail
          artifact="$(jq -r .artifact_file docs/source-classify-hf/metrics.json)"
          pub_rev="$(tr -d '[:space:]' < weights/published_revision.txt)"
          uv_args=(--no-project --with huggingface-hub)
          extra_args=()
          if [ "${RECOMPUTE}" = "true" ]; then
            uv_args=(--extra source-classify --with pyarrow)
            extra_args=(--recompute-raiw)
          fi
          uv run "${uv_args[@]}" \
            python scripts/sync_ai_detector_leaderboard.py \
            --weights "weights/$artifact" \
            --raiw-revision "$pub_rev" \
            "${extra_args[@]}" \
            --refresh-hub-dates \
            --publish \
            --message "Sync leaderboard to $artifact (GitHub ${SHA:0:7})" \
            --check-external-arenas \
            --summary-md weights/arena_summary.md
          cat weights/arena_summary.md >> "$GITHUB_STEP_SUMMARY"
