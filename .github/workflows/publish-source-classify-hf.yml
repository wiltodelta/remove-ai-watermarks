name: Publish source classifier to Hugging Face and GitHub

# Manual only. The derivative model weights live in a GitHub model release
# (`wiltodelta/raiw-source-classify` or a model-freeze tag in this repository);
# the private training corpus and caches never enter either repository.
# Also synchronizes `wiltodelta/ai-image-detector-leaderboard` and audits
# external benchmark/arena surfaces so public leaderboards never lag a freeze.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish"
        required: true
      weights_tag:
        description: "Release tag holding the frozen source-classify weights (defaults to metrics.json github_release_tag)"
        required: false
        default: ""
      github_release_tag:
        description: "Target release tag on wiltodelta/raiw-source-classify (defaults to metrics.json github_release_tag)"
        required: false
        default: ""
      recompute_leaderboard:
        description: "Re-evaluate the 578-image open benchmark on CPU before syncing the leaderboard Space"
        type: boolean
        required: false
        default: false

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Download derivative model weights
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_WEIGHTS_TAG: ${{ github.event.inputs.weights_tag }}
        run: |
          set -euo pipefail
          artifact="$(jq -r .artifact_file docs/source-classify-hf/metrics.json)"
          default_tag="$(jq -r .github_release_tag docs/source-classify-hf/metrics.json)"
          tag="${INPUT_WEIGHTS_TAG:-$default_tag}"
          test -n "$artifact" && test "$artifact" != "null"
          test -n "$tag" && test "$tag" != "null"
          mkdir -p weights
          if ! gh release download "$tag" \
            --repo "wiltodelta/raiw-source-classify" \
            --pattern "$artifact" \
            --dir weights 2>/dev/null; then
            gh release download "$tag" \
              --repo "${{ github.repository }}" \
              --pattern "$artifact" \
              --dir weights
          fi
          test -s "weights/$artifact"

      - name: Verify the frozen artifact
        run: |
          set -euo pipefail
          artifact="$(jq -r .artifact_file docs/source-classify-hf/metrics.json)"
          expected="$(jq -r .artifact_sha256 docs/source-classify-hf/metrics.json)"
          test -n "$artifact" && test "$artifact" != "null"
          test "${#expected}" -eq 64
          echo "$expected  weights/$artifact" | sha256sum --check

      - name: Publish model card and weights to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INPUT_GH_TAG: ${{ github.event.inputs.github_release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is not set" >&2
            exit 1
          fi
          gh_tag="${INPUT_GH_TAG:-$(jq -r .github_release_tag docs/source-classify-hf/metrics.json)}"
          uv run --no-project --with huggingface-hub \
            python scripts/publish_source_classify_hf.py \
            --src weights \
            --target hf \
            --github-release-tag "$gh_tag" \
            --revision-out weights/published_revision.txt \
            --message "Source-classify freeze (GitHub ${SHA:0:7})"

      - name: Sync standalone GitHub repository and release
        env:
          RAIW_SOURCE_CLASSIFY_TOKEN: ${{ secrets.RAIW_SOURCE_CLASSIFY_TOKEN }}
          INPUT_GH_TAG: ${{ github.event.inputs.github_release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${RAIW_SOURCE_CLASSIFY_TOKEN:-}" ]; then
            echo "::notice::RAIW_SOURCE_CLASSIFY_TOKEN secret is not set; skipping wiltodelta/raiw-source-classify GitHub sync."
            exit 0
          fi
          gh_tag="${INPUT_GH_TAG:-$(jq -r .github_release_tag docs/source-classify-hf/metrics.json)}"
          uv run --no-project \
            python scripts/publish_source_classify_hf.py \
            --src weights \
            --target github \
            --github-release-tag "$gh_tag" \
            --message "Source-classify $gh_tag (remove-ai-watermarks ${SHA:0:7})"

      - name: Sync Open AI Image Detector Leaderboard and audit external arenas
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHA: ${{ github.sha }}
          RECOMPUTE: ${{ github.event.inputs.recompute_leaderboard }}
        run: |
          set -euo pipefail
          artifact="$(jq -r .artifact_file docs/source-classify-hf/metrics.json)"
          pub_rev="$(tr -d '[:space:]' < weights/published_revision.txt)"
          uv_args=(--no-project --with huggingface-hub)
          extra_args=()
          if [ "${RECOMPUTE}" = "true" ]; then
            uv_args=(--extra source-classify --with pyarrow)
            extra_args=(--recompute-raiw)
          fi
          uv run "${uv_args[@]}" \
            python scripts/sync_ai_detector_leaderboard.py \
            --weights "weights/$artifact" \
            --raiw-revision "$pub_rev" \
            "${extra_args[@]}" \
            --refresh-hub-dates \
            --publish \
            --message "Sync leaderboard to $artifact (GitHub ${SHA:0:7})" \
            --check-external-arenas \
            --summary-md weights/arena_summary.md
          cat weights/arena_summary.md >> "$GITHUB_STEP_SUMMARY"
