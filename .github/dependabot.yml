version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # The `all` extra must remain jointly resolvable. These candidates violate
    # compatibility constraints: older supported TrustMark builds require NumPy 1.x, OpenCV 4.12+
    # requires NumPy 2 on newer Python versions, and this project keeps tokenizers
    # below 0.23 for the stable Transformers path. Keep Dependabot on the
    # compatible lines until those constraints move.
    ignore:
      - dependency-name: "numpy"
        versions:
          - ">=2"
      - dependency-name: "opencv-python-headless"
        versions:
          - ">=4.12"
      - dependency-name: "tokenizers"
        versions:
          - ">=0.23"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
