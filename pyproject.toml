[project]
# This name is the published PyPI distribution, not a local label: changing it
# strands every `pip install remove-ai-watermarks` and every pinned dependency
# on it, including the ComfyUI node package. The console script below carries
# the same weight, since users have it on PATH.
name = "remove-ai-watermarks"
version = "0.76.0"
description = "AI watermark remover for visible, invisible, and provenance marks in images, video, audio, and text"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "Apache-2.0"}
authors = [{name = "Victor Kuznetsov"}]
keywords = [
    "ai-watermark",
    "ai-watermark-remover",
    "watermark-remover",
    "watermark-removal",
    "remove-watermark",
    "synthid",
    "c2pa",
    "content-credentials",
    "nano-banana",
    "gemini",
    "gemini-watermark",
    "ai-metadata",
    "metadata-removal",
    "provenance",
    "exif",
    "stable-diffusion",
    "comfyui",
    "ai-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "pillow>=10.0.0",
    "piexif>=1.1.3",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    # Official C2PA reader (Content Authenticity Initiative, MIT/Apache-2.0). The
    # primary, spec-tracking manifest parser for the identify/metadata path; the
    # hand-rolled caBX/CBOR scanner in _internal/c2pa.py is kept only as a fallback for
    # synthetic/partial blobs the validator rejects. Binary wheel (Rust), but the
    # import is light (no torch/numpy) so it fits the dependency-light identify
    # host. Prebuilt wheels cover the full CI matrix (linux/macos/windows).
    # 0.39.0 (c2pa-rs 0.92) reports valid signatures as unknown and accepts a
    # rejected signer, so stay on 0.38 until a release passes the C2PA suite.
    "c2pa-python>=0.38.0,<0.39",
]

[project.optional-dependencies]
text = [
    "torch>=2.0.0",
    "transformers>=5,<5.16",
    "tokenizers>=0.22,<0.23",
    # Thresholds are evaluated against this packaged language model.
    "py3langid==0.4.0",
]
text-api = ["py3langid==0.4.0"]
# Optional Apple silicon text generation; the shared text guards also cover MLX.
text-mlx = [
    "mlx-lm>=0.32.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "py3langid==0.4.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
pixels = [
    "numpy>=1.24.0; python_version < '3.13'",
    # NumPy 1.x has no CPython 3.13+ wheels. Requiring 2.x prevents installers
    # from attempting an unsupported source build on the newer Python lines.
    "numpy>=2; python_version >= '3.13'",
    "opencv-python-headless>=4.8.0",
]
# Optional HEIC/AVIF pixel decode. Metadata scanning handles these containers
# without this plugin; combine `heif` with any pixel feature only when needed.
heif = [
    "pillow-heif>=0.13.0",
]
visible = ["remove-ai-watermarks[pixels]"]
# Video visible removal uses the shared pixel runtime. PyAV packetizes processed
# VFR frames with explicit PTS before FFmpeg encodes them. The full bundle
# includes both CLI tools, so video installations work without a system FFmpeg.
video = [
    "remove-ai-watermarks[visible]",
    "av>=18,<19",
    "portable-ffmpeg-full==0.5.0",
    "filelock>=3.20",
]
# Known-message decoding for the pinned public VideoSeal and PixelSeal models.
video-detect = ["remove-ai-watermarks[video]", "torch>=2.6"]
# Audio sample processing stays independent of OpenCV and the ML stack.
audio = [
    "numpy>=1.24.0; python_version < '3.13'",
    "numpy>=2; python_version >= '3.13'",
    "scipy>=1.13.0",
]
# The open AudioSeal model verifies compatible audio marks locally. This is
# separate from proprietary provider audio-watermark verification.
audio-detect = [
    "remove-ai-watermarks[audio]",
    "audioseal==0.2.1",
    "huggingface-hub>=0.20.0,<2",
]
# Compatible public WavMark decoding, separate from production provider claims.
audio-wavmark = [
    "remove-ai-watermarks[audio]",
    "wavmark==0.0.3",
    "huggingface-hub>=0.20.0,<2",
]
# Public Perth v1; validated model modules load without the legacy package initializer.
audio-perth = [
    "remove-ai-watermarks[audio]",
    "resemble-perth==1.0.1",
    "torch>=2.0.0",
    "librosa>=0.10",
    "soundfile>=0.12.1",
    "PyYAML>=6",
    "torchaudio>=2.11",
]
# Pinned Sony decoder, without the obsolete SDK Torch upper bound.
audio-silentcipher = [
    "remove-ai-watermarks[audio]",
    "torch>=2.6",
    "librosa>=0.10",
    "huggingface-hub>=0.20.0,<2",
]
# Optional neural codec resynthesis, separate from compatible watermark decoders.
audio-codec = [
    "remove-ai-watermarks[audio]",
    "torch>=2.0.0",
    "transformers>=5,<5.16",
    "safetensors",
    "huggingface-hub>=0.20.0,<2",
]
# Open DWT-DCT watermarks used by Stable Diffusion / SDXL / FLUX. The in-tree
# decoder avoids the upstream invisible-watermark package's mandatory torch and
# non-headless OpenCV dependencies.
detect = [
    "remove-ai-watermarks[pixels]",
    "PyWavelets>=1.1.1",
]
diffusion = [
    "remove-ai-watermarks[pixels]",
    # Preserve the historical text runtime installed through this extra.
    "py3langid==0.4.0",
    # Image regeneration requires NVIDIA CUDA. Video VAE profiles also support
    # CPU and MPS when the selected Torch stack supports the host platform.
    "torch>=2.0.0",
    "diffusers>=0.38.0",
    # diffusers 0.38's auto-pipeline registry imports ``Qwen3VLForConditional
    # Generation`` (its ``nucleusmoe_image`` pipeline), which only exists in
    # transformers 5.x -- so ``from diffusers import AutoPipelineForImage2Image``
    # fails on transformers 4.x. The real SDXL-loading break was NOT transformers
    # 5.x but the tokenizers *release candidate* (0.23.0rc0) that the global
    # ``prerelease = "allow"`` drags in: its CLIP tokenizer raises
    # ``RobertaProcessing.__new__() got an unexpected keyword argument 'cls'``.
    # Cap tokenizers to the verified stable 0.22 line so the rc is excluded
    # while SDXL still loads.
    # Transformers 5.16+ requires tokenizers 0.23.1+, outside the verified
    # stable tokenizer line below. Keep the published extras jointly resolvable.
    "transformers>=5,<5.16",
    "tokenizers>=0.22,<0.23",
    "accelerate>=0.25.0",
    "safetensors",
    # Wan 2.1 3D video diffusion uses UMT5 (SentencePiece) and ftfy normalization.
    "sentencepiece>=0.2.2,<0.3",
    "ftfy>=6.3.1",
]
# Full two-stage high-fidelity profile: Qwen-Image-2512 Lightning + DiffSynth
# Canny ControlNet for the frame, then SAM-masked Z-Image Turbo face repair.
# CUDA-only and intentionally separate from the normal diffusion extra because the
# additional model stack and DiffSynth runtime are large.
qwen-zimage = [
    "remove-ai-watermarks[diffusion]",
    "diffsynth>=2.0.17,<3",
    # Chroma1-HD ships a binary spiece.model. Without the matching backend,
    # Transformers falls through to tiktoken, which cannot parse that file.
    "sentencepiece>=0.2.2,<0.3",
    "torchvision>=0.20.0",
    # Fixed perceptual acceptance model for qwen21-zimage.
    "lpips==0.1.4",
]
# Opt-in verified-text reconstruction over qwen-zimage. LaMa removes the changed
# candidate glyphs before exact Qwen-VAE cores are composited back.
text-restoration = [
    "remove-ai-watermarks[qwen-zimage,lama]",
]
# Draft-only OCR proposals for verified-text manifests. CPU, no torch:
# PaddleOCR detection plus three script-chosen recognition engines. The models
# download on first use and are cached by huggingface_hub; never bundled.
# Keep every Hub extra below 2 so it remains composable with Diffusers (<2).
# PaddleX, under PaddleOCR, pins opencv-contrib-python==4.10.0.84, which installs
# into the same cv2 package as opencv-python-headless; mixed versions leave cv2
# unimportable, so this extra holds headless at the same version.
text-draft = [
    "paddleocr>=3.3.3",
    "paddlepaddle>=3.0.0",
    "opencv-python-headless==4.10.0.84",
    "huggingface-hub>=0.20.0,<2",
]
# Adobe TrustMark decoder -- the open, keyless watermark behind Adobe Durable
# Content Credentials (soft-binding alg ``com.adobe.trustmark.P``). Optional
# because it pulls torch and downloads model weights on first use. identify()
# guards the import and skips the TrustMark signal when absent.
trustmark = [
    # 0.9.2 (2026-09-08) dropped the NumPy <2 pin that kept earlier releases off
    # CPython 3.13+; its 13 detector tests pass on 3.13 with NumPy 2.5.3.
    "trustmark>=0.9.2",
]
# Unified 10-provider source-pipeline + synthetic-image classifier (NumPy +
# ONNX Runtime CPU, no torch). identify never imports this extra, and it is not
# a SynthID detector. Weights download on first use.
source-classify = [
    "remove-ai-watermarks[pixels]",
    "huggingface-hub>=0.20.0,<2",
    "onnxruntime>=1.24.0",
]
# Universal region eraser backend -- big-LaMa via onnxruntime (Carve/LaMa-ONNX,
# Apache-2.0). CPU, no torch. Model (~200 MB) is downloaded on first use and
# cached by huggingface_hub; it is never bundled in this repo. The default cv2
# eraser backend needs none of this.
lama = [
    "remove-ai-watermarks[visible]",
    "onnxruntime>=1.24.0",
    "huggingface-hub>=0.20.0,<2",
]
# Lightweight inpaint backend -- MI-GAN via onnxruntime (andraniksargsyan/migan,
# MIT). CPU, no torch. Model (~28 MB) downloaded on first use and cached by
# huggingface_hub; never bundled. ~700-950 MB peak RAM / ~0.19 s/call -- the
# memory-tight learned tier (vs big-LaMa's ~4.7 GB). Select it explicitly when
# LaMa, the quality-first `auto` choice, is too large. Same runtime as `lama`.
migan = [
    "remove-ai-watermarks[visible]",
    "onnxruntime>=1.24.0",
    "huggingface-hub>=0.20.0,<2",
]
dev = [
    "remove-ai-watermarks[video]",
    "remove-ai-watermarks[detect]",
    # API transport tests exercise the actual packaged language checker.
    "remove-ai-watermarks[text-api]",
    # Development-only OpenAI Content Provenance oracle. It is not exposed by
    # the installed CLI or the public Python API.
    "openai>=2.52.0",
    # Runtime detector and controlled AudioSeal fixture generation share the
    # same pinned model seam. The generator remains a development helper.
    "remove-ai-watermarks[audio-detect]",
    "huggingface-hub>=0.20.0,<2",
    # Direct Microsoft Content Provenance API transport. The adapter uses an
    # Azure CLI Entra token and ignores process proxy settings.
    "httpx>=0.28,<1",
    # Development-only isolated browser automation for public provider oracles.
    "playwright>=1.62,<2",
    # The official MCP client, used only to test `remove-ai-watermarks mcp`
    # against the reference implementation. The server itself is stdlib-only.
    "mcp>=2.3,<3",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "packaging>=24.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "invisible-watermark>=0.2.0",
]
# ``qwen-zimage`` already pulls ``diffusion``; naming both would suggest diffusion is
# independently sufficient for a removal, which it is not.
all = ["remove-ai-watermarks[video,video-detect,heif,detect,trustmark,text-restoration,migan,source-classify,audio-detect,audio-codec,audio-wavmark,audio-perth,audio-silentcipher,text,text-mlx]"]

[project.scripts]
remove-ai-watermarks = "remove_ai_watermarks.cli:main"

[project.urls]
Homepage = "https://raiw.cc"
Repository = "https://github.com/wiltodelta/remove-ai-watermarks"
Author = "https://wiltodelta.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Lock-resolution only; not published metadata. PaddleX 3.7 (the `ocr` extra's
# PaddleOCR) requires NumPy <2.4, and without this cap `uv lock --upgrade`
# prefers the newest NumPy and silently downgrades PaddleOCR to 3.4.
# opencv-python comes only from the dev group's invisible-watermark; it shares
# cv2 with the headless and contrib wheels, so it follows the text-draft pin.
constraint-dependencies = [
    "numpy<2.4",
    "opencv-python==4.10.0.84",
    # These C2PA releases omit binary wheels on the affected platforms.
    "c2pa-python!=0.38.2; sys_platform != 'darwin'",
    "c2pa-python!=0.38.1; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remove_ai_watermarks"]

[tool.hatch.build.targets.sdist]
# Keep the source distribution small and public-safe: ship tracked source and
# metadata, not corpora or local research/session artifacts. The wheel ships
# only src/.
include = [
    "/src",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
exclude = [
    "/data",
    "/tmp",
    "/.sc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["_refs", ".local-eval"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S", "UP", "SIM", "RET", "COM", "C4", "G", "PT", "PIE", "T20", "DTZ", "ICN", "TCH", "RUF", "ANN"]
ignore = [
    "COM812",  # missing trailing comma (conflicts with ruff formatter)
    "ANN401",  # typing.Any — sometimes unavoidable with third-party libs
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["G004", "S108", "S310", "T20"]
"tests/*.py" = ["ANN", "S101", "S105", "S106", "S108"]  # fixture and mock signatures need not annotate every parameter
"src/remove_ai_watermarks/_internal/watermark_remover.py" = ["S603", "S606", "S607"]  # nvidia-smi capability probe
"src/remove_ai_watermarks/_internal/c2pa.py" = ["S110"]  # try-except-pass for corrupt file handling

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
exclude = ["_refs", ".local-eval"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportAttributeAccessIssue = false
reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportArgumentType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
